name: Phase 2 Typecheck Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase2-typecheck-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture typecheck diagnostics
        shell: bash
        run: |
          set +e
          pnpm typecheck > phase2-typecheck.log 2>&1
          status=$?
          set -e
          cat phase2-typecheck.log
          echo "$status" > phase2-typecheck.status

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-typecheck-diagnostics
          path: |
            phase2-typecheck.log
            phase2-typecheck.status
          retention-days: 1
