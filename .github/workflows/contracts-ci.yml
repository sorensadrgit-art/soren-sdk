name: Contracts CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/contracts-ci.yml"
      - "capabilities/**"
      - "packages/contracts/**"
      - "schemas/**"
      - "sdk-connectors/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "eslint.config.js"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contracts-ci.yml"
      - "capabilities/**"
      - "packages/contracts/**"
      - "schemas/**"
      - "sdk-connectors/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "eslint.config.js"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate repository contracts
        run: pnpm validate:repository
