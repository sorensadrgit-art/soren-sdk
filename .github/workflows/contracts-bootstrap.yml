name: Bootstrap Contracts v2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/scaffold-contracts.mjs"
      - "scripts/scaffold-payload-*.txt"
      - ".github/workflows/contracts-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/contracts-v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize RED fixture
        run: node scripts/scaffold-contracts.mjs --red

      - name: Install dependencies and create lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify RED state
        shell: bash
        run: |
          set +e
          pnpm test > red-test.log 2>&1
          status=$?
          set -e
          cat red-test.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the canonical JSON test to fail before implementation."
            exit 1
          fi

      - name: Materialize full implementation
        run: node scripts/scaffold-contracts.mjs --full

      - name: Apply NodeNext compatibility fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tsconfig = Path("tsconfig.json")
          config = json.loads(tsconfig.read_text())
          config["compilerOptions"]["esModuleInterop"] = True
          config["compilerOptions"]["allowSyntheticDefaultImports"] = True
          tsconfig.write_text(json.dumps(config, indent=2) + "\n")

          validator = Path("packages/contracts/src/validation/validator.ts")
          text = validator.read_text()
          old_imports = (
              'import Ajv2020, {\n'
              '  type AnySchemaObject,\n'
              '  type ErrorObject,\n'
              '  type ValidateFunction\n'
              '} from "ajv/dist/2020.js";\n'
              'import addFormats from "ajv-formats";'
          )
          new_imports = (
              'import { createRequire } from "node:module";\n'
              'import type {\n'
              '  AnySchemaObject,\n'
              '  ErrorObject,\n'
              '  ValidateFunction\n'
              '} from "ajv";\n\n'
              'interface AjvInstance {\n'
              '  readonly errors?: ErrorObject[] | null;\n'
              '  validateSchema(schema: AnySchemaObject): boolean;\n'
              '  compile(schema: AnySchemaObject): ValidateFunction;\n'
              '}\n\n'
              'type AjvConstructor = new (\n'
              '  options: Record<string, unknown>\n'
              ') => AjvInstance;\n'
              'type AddFormats = (ajv: AjvInstance) => unknown;\n\n'
              'const require = createRequire(import.meta.url);\n\n'
              'function loadDefaultOrModule<T>(moduleId: string): T {\n'
              '  const loaded = require(moduleId) as unknown;\n'
              '  if (\n'
              '    typeof loaded === "object" &&\n'
              '    loaded !== null &&\n'
              '    "default" in loaded\n'
              '  ) {\n'
              '    return (loaded as { default: T }).default;\n'
              '  }\n'
              '  return loaded as T;\n'
              '}\n\n'
              'const Ajv2020 = loadDefaultOrModule<AjvConstructor>("ajv/dist/2020");\n'
              'const addFormats = loadDefaultOrModule<AddFormats>("ajv-formats");'
          )
          if old_imports not in text:
              raise SystemExit("Expected Ajv import block was not found.")
          text = text.replace(old_imports, new_imports)
          text = text.replace(
              "  getContractValidator().assert<T>(name, value);",
              "  const validator: ContractValidator = getContractValidator();\n  validator.assert<T>(name, value);"
          )
          validator.write_text(text)

          registry = Path("packages/contracts/src/schemas/registry.ts")
          text = registry.read_text()
          text = text.replace(
              'import { dirname, join, resolve } from "node:path";',
              'import { dirname, join } from "node:path";'
          )
          old_candidates = (
              'function candidateSchemaDirectories(): string[] {\n'
              '  const moduleDirectory = dirname(fileURLToPath(import.meta.url));\n\n'
              '  return [\n'
              '    join(moduleDirectory, "../schema-data"),\n'
              '    resolve(process.cwd(), "schemas")\n'
              '  ];\n'
              '}'
          )
          new_candidates = (
              'function workspaceSchemaCandidates(): string[] {\n'
              '  const candidates: string[] = [];\n'
              '  let current = process.cwd();\n\n'
              '  for (let depth = 0; depth < 6; depth += 1) {\n'
              '    candidates.push(join(current, "schemas"));\n'
              '    const parent = dirname(current);\n'
              '    if (parent === current) break;\n'
              '    current = parent;\n'
              '  }\n\n'
              '  return candidates;\n'
              '}\n\n'
              'function candidateSchemaDirectories(): string[] {\n'
              '  const moduleDirectory = dirname(fileURLToPath(import.meta.url));\n\n'
              '  return [\n'
              '    join(moduleDirectory, "../schema-data"),\n'
              '    ...workspaceSchemaCandidates()\n'
              '  ];\n'
              '}'
          )
          if old_candidates not in text:
              raise SystemExit("Expected schema candidate block was not found.")
          registry.write_text(text.replace(old_candidates, new_candidates))
          PY

      - name: Remove bootstrap-only files
        run: |
          rm scripts/scaffold-contracts.mjs
          rm scripts/scaffold-payload-1.txt
          rm scripts/scaffold-payload-2.txt
          rm scripts/scaffold-payload-3.txt
          rm scripts/scaffold-payload-4.txt
          rm .github/workflows/contracts-bootstrap.yml

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        shell: bash
        run: |
          pnpm typecheck 2>&1 | tee typecheck.log
          exit ${PIPESTATUS[0]}

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Test
        shell: bash
        run: |
          pnpm test 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Build
        run: pnpm build

      - name: Validate repository contracts
        run: pnpm validate:repository

      - name: Commit verified implementation
        run: |
          git config user.name "soren-sdk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(contracts): implement versioned contracts and validation"
          git push origin HEAD:feat/contracts-v2
