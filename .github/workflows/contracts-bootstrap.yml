name: Bootstrap Contracts v2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/scaffold-contracts.mjs"
      - "scripts/scaffold-payload-*.txt"
      - ".github/workflows/contracts-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/contracts-v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize RED fixture
        run: node scripts/scaffold-contracts.mjs --red

      - name: Install dependencies and create lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify RED state
        shell: bash
        run: |
          set +e
          pnpm test > red-test.log 2>&1
          status=$?
          set -e
          cat red-test.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the canonical JSON test to fail before implementation."
            exit 1
          fi

      - name: Materialize full implementation
        run: node scripts/scaffold-contracts.mjs --full

      - name: Apply NodeNext compatibility fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tsconfig = Path("tsconfig.json")
          config = json.loads(tsconfig.read_text())
          config["compilerOptions"]["esModuleInterop"] = True
          config["compilerOptions"]["allowSyntheticDefaultImports"] = True
          tsconfig.write_text(json.dumps(config, indent=2) + "\n")

          validator = Path("packages/contracts/src/validation/validator.ts")
          text = validator.read_text()
          text = text.replace(
              "  getContractValidator().assert<T>(name, value);",
              "  const validator: ContractValidator = getContractValidator();\n  validator.assert<T>(name, value);"
          )
          validator.write_text(text)

          registry = Path("packages/contracts/src/schemas/registry.ts")
          text = registry.read_text()
          text = text.replace(
              'import { dirname, join, resolve } from "node:path";',
              'import { dirname, join } from "node:path";'
          )
          text = text.replace(
              "function candidateSchemaDirectories(): string[] {\n  const moduleDirectory = dirname(fileURLToPath(import.meta.url));\n\n  return [\n    join(moduleDirectory, \"../schema-data\"),\n    resolve(process.cwd(), \"schemas\")\n  ];\n}",
              "function workspaceSchemaCandidates(): string[] {\n  const candidates: string[] = [];\n  let current = process.cwd();\n\n  for (let depth = 0; depth < 6; depth += 1) {\n    candidates.push(join(current, \"schemas\"));\n    const parent = dirname(current);\n    if (parent === current) break;\n    current = parent;\n  }\n\n  return candidates;\n}\n\nfunction candidateSchemaDirectories(): string[] {\n  const moduleDirectory = dirname(fileURLToPath(import.meta.url));\n\n  return [\n    join(moduleDirectory, \"../schema-data\"),\n    ...workspaceSchemaCandidates()\n  ];\n}"
          )
          registry.write_text(text)
          PY

      - name: Remove bootstrap-only files
        run: |
          rm scripts/scaffold-contracts.mjs
          rm scripts/scaffold-payload-1.txt
          rm scripts/scaffold-payload-2.txt
          rm scripts/scaffold-payload-3.txt
          rm scripts/scaffold-payload-4.txt
          rm .github/workflows/contracts-bootstrap.yml

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        shell: bash
        run: |
          pnpm typecheck 2>&1 | tee typecheck.log
          exit ${PIPESTATUS[0]}

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 1

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate repository contracts
        run: pnpm validate:repository

      - name: Commit verified implementation
        run: |
          git config user.name "soren-sdk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(contracts): implement versioned contracts and validation"
          git push origin HEAD:feat/contracts-v2
