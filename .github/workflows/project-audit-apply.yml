name: Project Audit Fix Apply

on:
  push:
    branches:
      - feat/native-first-router-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/native-first-router-v1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Apply guarded fixes
        run: node scripts/apply-project-audit-fixes.mjs

      - name: Commit audited source changes
        run: |
          rm scripts/apply-project-audit-fixes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(audit): correct routing reuse and YAML parsing"
          git push origin HEAD:feat/native-first-router-v1
