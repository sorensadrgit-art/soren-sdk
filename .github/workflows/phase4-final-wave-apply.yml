name: Phase 4 Final Wave Apply

on:
  push:
    branches:
      - feat/native-first-router-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/native-first-router-v1
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply guarded fixes
        run: node scripts/apply-phase4-final-wave.mjs

      - name: Verify generated changes
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm validate:repository
          pnpm smoke:cli

      - name: Commit verified source changes
        run: |
          rm scripts/apply-phase4-final-wave.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(review): close final Phase 4 correctness gaps"
          git push origin HEAD:feat/native-first-router-v1
