name: Phase 2 Lockfile Refresh

on:
  push:
    branches:
      - feat/catalog-core-v1
    paths:
      - ".github/workflows/phase2-lockfile.yml"
      - "packages/connectors/package.json"
      - "packages/cli/package.json"
      - "package.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/catalog-core-v1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile only
        run: |
          git config user.name "soren-sdk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore(catalog): refresh workspace lockfile"
            git push origin HEAD:feat/catalog-core-v1
          fi
